<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Calculator</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.9);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #818cf8;
        --danger: #fb7185;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 60%, #020617 100%);
        color: var(--text);
        padding: 24px;
      }

      .calculator {
        width: min(92vw, 360px);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        padding: 22px;
        box-shadow: 0 20px 60px rgba(2, 6, 23, 0.45);
        backdrop-filter: blur(16px);
      }

      .display {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 16px;
      }

      .expression {
        min-height: 28px;
        font-size: 1rem;
        color: var(--muted);
        margin-bottom: 8px;
        word-break: break-all;
      }

      .result {
        font-size: 2rem;
        font-weight: 700;
        text-align: right;
        min-height: 38px;
        overflow-x: auto;
        white-space: nowrap;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 16px;
        padding: 16px 0;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        color: var(--text);
        background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        transition: transform 0.15s ease, background 0.15s ease;
      }

      button:hover { transform: translateY(-1px); }
      button:active { transform: scale(0.98); }

      .operator { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
      .equals { background: linear-gradient(135deg, #22c55e, #14b8a6); }
      .clear { background: linear-gradient(135deg, var(--danger), #f97316); }
      .zero { grid-column: span 2; }

      .hint {
        margin-top: 12px;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 480px) {
        .calculator { padding: 18px; }
        .result { font-size: 1.7rem; }
        button { padding: 14px 0; }
      }
    </style>
  </head>
  <body>
    <main class="calculator" aria-label="미니 계산기">
      <section class="display" aria-live="polite">
        <div class="expression" id="expression">0</div>
        <div class="result" id="result">0</div>
      </section>

      <section class="buttons" aria-label="계산기 버튼">
        <button class="clear" data-action="clear">C</button>
        <button data-action="delete">⌫</button>
        <button class="operator" data-value="/">÷</button>
        <button class="operator" data-value="*">×</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="-">−</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="+">+</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="equals" data-action="equals">=</button>

        <button class="zero" data-value="0">0</button>
        <button data-value=".">.</button>
      </section>

      <div class="hint">키보드로도 바로 입력할 수 있어요</div>
    </main>

    <script>
      const expressionEl = document.getElementById('expression');
      const resultEl = document.getElementById('result');
      let expression = '';
      let lastResult = '0';

      function updateDisplay() {
        expressionEl.textContent = expression || '0';
        resultEl.textContent = lastResult;
      }

      function appendValue(value) {
        if (expression === '0' && value !== '.') {
          expression = value;
        } else {
          expression += value;
        }
        lastResult = '0';
        updateDisplay();
      }

      function clearAll() {
        expression = '';
        lastResult = '0';
        updateDisplay();
      }

      function deleteLast() {
        expression = expression.slice(0, -1);
        if (!expression) {
          expression = '';
          lastResult = '0';
        }
        updateDisplay();
      }

      function evaluateExpression() {
        const safeExpression = expression.replace(/[^0-9.+\-*/() ]/g, '');
        if (!safeExpression) {
          lastResult = '0';
          updateDisplay();
          return;
        }

        try {
          const result = Function(`"use strict"; return (${safeExpression})`)();
          if (!Number.isFinite(result)) {
            throw new Error('Invalid');
          }
          lastResult = Number.isInteger(result) ? String(result) : result.toFixed(10).replace(/\.0+$|(?<=\d)0+$/g, '');
          expression = lastResult;
        } catch (error) {
          lastResult = '오류';
          expression = '';
        }
        updateDisplay();
      }

      document.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          const { value, action } = button.dataset;

          if (action === 'clear') {
            clearAll();
            return;
          }

          if (action === 'delete') {
            deleteLast();
            return;
          }

          if (action === 'equals') {
            evaluateExpression();
            return;
          }

          if (value) {
            appendValue(value);
          }
        });
      });

      document.addEventListener('keydown', (event) => {
        const key = event.key;

        if (/^[0-9.]$/.test(key)) {
          appendValue(key);
          return;
        }

        if (['+', '-', '*', '/', '(', ')'].includes(key)) {
          appendValue(key);
          return;
        }

        if (key === 'Enter' || key === '=') {
          evaluateExpression();
          return;
        }

        if (key === 'Backspace') {
          deleteLast();
          return;
        }

        if (key.toLowerCase() === 'c') {
          clearAll();
        }
      });

      updateDisplay();
    </script>
  </body>
</html>
