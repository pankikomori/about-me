<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개 + 미니 계산기</title>
    <style>
        :root{--bg:#f5f7fa;--card:#fff;--accent:#4a7aff;--muted:#6b7280}
        html,body{height:100%;margin:0;font-family:Malgun Gothic, Apple SD Gothic Neo, sans-serif;background:var(--bg)}
        .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px}
        .card{width:100%;max-width:760px;background:var(--card);border-radius:14px;box-shadow:0 12px 30px rgba(2,6,23,0.06);padding:22px;display:grid;grid-template-columns:1fr 360px;gap:18px}
        .left h1{margin:0 0 6px;font-size:22px;color:#111}
        .badge{color:var(--accent);font-weight:700;margin-bottom:14px;display:inline-block}
        .section{background:#f8f9fa;padding:12px;border-radius:10px;margin-bottom:12px}
        .section h3{margin:0 0 8px;font-size:15px;color:#333}
        .section p{margin:6px 0;color:var(--muted);font-size:14px}

        /* Calculator */
        .calculator{background:linear-gradient(180deg,#f9fbff,#fff);padding:14px;border-radius:12px}
        .display{background:#0f1724;color:#e6f0ff;padding:12px;border-radius:8px;text-align:right;font-size:28px;min-height:56px;overflow:hidden}
        .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
        .key{padding:12px;border-radius:10px;border:0;background:#fff;box-shadow:0 6px 12px rgba(2,6,23,0.04);font-size:16px;cursor:pointer}
        .key-operator{background:#eef2ff;font-weight:600}
        .key-equals{background:var(--accent);color:#fff}
        .zero{grid-column:span 2}

        @media(max-width:820px){.card{grid-template-columns:1fr;max-width:520px}.calculator{margin-top:6px}}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <div class="left">
                <h1>안녕하세요, 장우진입니다! 👋</h1>
                <div class="badge">Naver Boostcamp AI Agent Challenge 참가자</div>

                <div class="section">
                    <h3>🏫 학과</h3>
                    <p>부산대학교 바이오환경에너지학과 재학 중</p>
                </div>

                <div class="section">
                    <h3>💡 나를 소개</h3>
                    <p><strong>닉네임:</strong> 판례 히키코모리</p>
                    <p><strong>관심 분야:</strong> 서비스 기획, 공익형 에이전트 구현, 바이오환경에너지</p>
                </div>
            </div>

            <aside>
                <div class="section calculator">
                    <h3>🧮 미니 계산기</h3>
                    <div class="calculator" id="calc">
                        <div class="display" id="display">0</div>
                        <div class="keys" aria-hidden="false">
                            <button class="key key-operator" data-action="clear">C</button>
                            <button class="key key-operator" data-action="back">⌫</button>
                            <button class="key key-operator" data-action="percent">%</button>
                            <button class="key key-operator" data-action="divide">÷</button>

                            <button class="key">7</button>
                            <button class="key">8</button>
                            <button class="key">9</button>
                            <button class="key key-operator" data-action="multiply">×</button>

                            <button class="key">4</button>
                            <button class="key">5</button>
                            <button class="key">6</button>
                            <button class="key key-operator" data-action="subtract">−</button>

                            <button class="key">1</button>
                            <button class="key">2</button>
                            <button class="key">3</button>
                            <button class="key key-operator" data-action="add">+</button>

                            <button class="key zero">0</button>
                            <button class="key">.</button>
                            <button class="key key-equals" data-action="equals">=</button>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
    (function(){
        const display = document.getElementById('display');
        const keys = document.querySelector('.keys');
        let expr = '';

        function update(){ display.textContent = expr || '0'; }

        function sanitize(s){ return s.replace(/[×]/g,'*').replace(/[÷]/g,'/').replace(/[−]/g,'-').replace(/[^0-9+\-*/().%]/g,''); }

        function compute(){
            try{ const res = eval(sanitize(expr)); expr = String(res); }
            catch(e){ expr = 'Error' }
            update();
        }

        keys.addEventListener('click', e=>{
            const btn = e.target.closest('button'); if(!btn) return;
            const action = btn.dataset.action; const v = btn.textContent.trim();
            if(action==='clear'){ expr=''; update(); return }
            if(action==='back'){ expr=expr.slice(0,-1); update(); return }
            if(action==='percent'){ try{ expr = String((parseFloat(expr||'0')/100)); }catch{expr=''} update(); return }
            if(action==='equals'){ compute(); return }
            expr += v; update();
        });

        window.addEventListener('keydown', e=>{
            if((/^[0-9]$/).test(e.key) || '+-*/().'.includes(e.key)){
                expr += e.key; update(); e.preventDefault(); return;
            }
            if(e.key==='Enter' || e.key==='='){ compute(); e.preventDefault(); return }
            if(e.key==='Backspace'){ expr=expr.slice(0,-1); update(); e.preventDefault(); return }
            if(e.key==='Escape'){ expr=''; update(); e.preventDefault(); }
        });

        update();
    })();
    </script>
</body>
</html>
