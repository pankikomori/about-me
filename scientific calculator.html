<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scientific Calculator</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #060816;
        --panel: rgba(13, 18, 37, 0.92);
        --panel-2: rgba(20, 27, 49, 0.95);
        --text: #f2f7ff;
        --muted: #89a0c4;
        --accent: #4dd3ff;
        --accent-2: #8b5cf6;
        --danger: #ff6b6b;
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        background:
          radial-gradient(circle at top, rgba(77, 211, 255, 0.16), transparent 32%),
          linear-gradient(135deg, #050713 0%, var(--bg) 100%);
        color: var(--text);
        padding: 24px;
      }

      .calculator {
        width: min(100%, 560px);
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 24px;
        backdrop-filter: blur(20px);
      }

      .brand {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }

      .brand h1 {
        font-size: 1.2rem;
        font-weight: 700;
        margin: 0;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand span {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .display {
        background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
        border: 1px solid rgba(255,255,255,0.08);
        color: var(--text);
        border-radius: 18px;
        min-height: 92px;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 6px;
        margin-bottom: 18px;
        overflow: hidden;
      }

      .display .expression {
        font-size: 1.25rem;
        color: var(--text);
        word-break: break-all;
        min-height: 30px;
      }

      .display .result {
        font-size: 2rem;
        font-weight: 700;
        color: var(--accent);
        text-align: right;
        word-break: break-all;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 16px;
        padding: 14px 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        color: var(--text);
        background: var(--panel-2);
      }

      button:hover {
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(0);
      }

      .operator {
        background: linear-gradient(145deg, rgba(77, 211, 255, 0.22), rgba(77, 211, 255, 0.12));
      }

      .accent {
        background: linear-gradient(145deg, rgba(139, 92, 246, 0.28), rgba(139, 92, 246, 0.16));
      }

      .danger {
        background: linear-gradient(145deg, rgba(255, 107, 107, 0.28), rgba(255, 107, 107, 0.16));
      }

      .equals {
        background: linear-gradient(145deg, rgba(76, 201, 240, 0.34), rgba(77, 211, 255, 0.18));
      }

      .pill {
        grid-column: span 2;
      }

      .note {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.88rem;
        text-align: center;
      }

      @media (max-width: 640px) {
        .calculator {
          padding: 18px;
        }

        .buttons {
          gap: 8px;
        }

        button {
          padding: 12px 8px;
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="calculator" aria-label="Scientific calculator">
      <div class="brand">
        <h1>Scientific Calculator</h1>
        <span>Dark Mode</span>
      </div>

      <section class="display" aria-live="polite">
        <div class="expression" id="expression">0</div>
        <div class="result" id="result">0</div>
      </section>

      <section class="buttons" aria-label="Calculator buttons">
        <button class="accent" data-value="sin(">sin</button>
        <button class="accent" data-value="cos(">cos</button>
        <button class="accent" data-value="tan(">tan</button>
        <button class="accent" data-value="π">π</button>
        <button class="danger" id="clear">C</button>

        <button class="operator" data-value="log(">log</button>
        <button class="operator" data-value="ln(">ln</button>
        <button class="operator" data-value="√(">√</button>
        <button class="operator" data-value="(">(</button>
        <button class="operator" data-value=")">)</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="/">÷</button>
        <button class="operator" data-value="Backspace">⌫</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="*">×</button>
        <button class="accent" data-value="e">e</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="operator" data-value="-">−</button>
        <button class="operator" data-value="^">^</button>

        <button class="pill" data-value="0">0</button>
        <button data-value=".">.</button>
        <button class="operator" data-value="+">+</button>
        <button class="equals" id="equals">=</button>
      </section>

      <div class="note">지원 기능: 사칙연산, 삼각함수, 로그, 제곱근, 괄호, π, e</div>
    </main>

    <script>
      const expressionEl = document.getElementById('expression');
      const resultEl = document.getElementById('result');
      const clearBtn = document.getElementById('clear');
      const equalsBtn = document.getElementById('equals');
      const buttons = document.querySelectorAll('button[data-value]');

      let expression = '';
      let lastResult = '0';

      function updateDisplay() {
        expressionEl.textContent = expression || '0';
        resultEl.textContent = lastResult;
      }

      function appendValue(value) {
        if (expression === 'Error') {
          expression = '';
        }
        if (expression === '0' && value !== '.' && !['+', '-', '*', '/', '(', ')', 'π', 'e', 'sin(', 'cos(', 'tan(', 'log(', 'ln(', '√('].includes(value)) {
          expression = '';
        }

        if (value === 'Backspace') {
          expression = expression.slice(0, -1);
        } else if (value === 'π') {
          expression += 'π';
        } else if (value === 'e') {
          expression += 'e';
        } else if (value === '√(') {
          expression += '√('; 
        } else {
          expression += value;
        }

        if (!expression) {
          expression = '0';
        }
        updateDisplay();
      }

      function clearAll() {
        expression = '';
        lastResult = '0';
        updateDisplay();
      }

      function evaluateExpression() {
        const trimmed = expression.trim();
        if (!trimmed || trimmed === '0') {
          lastResult = '0';
          updateDisplay();
          return;
        }

        const converted = trimmed
          .replace(/×/g, '*')
          .replace(/÷/g, '/')
          .replace(/\^/g, '**')
          .replace(/π/g, 'Math.PI')
          .replace(/e/g, 'Math.E')
          .replace(/√\(/g, 'Math.sqrt(')
          .replace(/sin\(/g, 'Math.sin(')
          .replace(/cos\(/g, 'Math.cos(')
          .replace(/tan\(/g, 'Math.tan(')
          .replace(/log\(/g, 'Math.log10(')
          .replace(/ln\(/g, 'Math.log(');

        try {
          const result = Function(`"use strict"; return (${converted});`)();
          if (!Number.isFinite(result)) {
            throw new Error('Invalid result');
          }
          const rounded = Math.abs(result) < 1e-12 ? 0 : Number(result.toFixed(12));
          expression = trimmed;
          lastResult = String(rounded);
          updateDisplay();
        } catch (error) {
          expression = 'Error';
          lastResult = 'Invalid expression';
          updateDisplay();
        }
      }

      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          const value = button.getAttribute('data-value');
          if (value === 'Backspace') {
            appendValue('Backspace');
          } else {
            appendValue(value);
          }
        });
      });

      clearBtn.addEventListener('click', clearAll);
      equalsBtn.addEventListener('click', evaluateExpression);

      document.addEventListener('keydown', (event) => {
        const key = event.key;
        const map = {
          Enter: '=',
          '=': '=',
          Backspace: 'Backspace',
          '*': '*',
          '/': '/',
          '+': '+',
          '-': '-',
          '(': '(',
          ')': ')',
          '.': '.',
          p: 'π',
          P: 'π',
          e: 'e',
          E: 'e',
        };

        if (key === 'Enter' || key === '=') {
          event.preventDefault();
          evaluateExpression();
          return;
        }

        if (key === 'Backspace') {
          event.preventDefault();
          appendValue('Backspace');
          return;
        }

        if (/^[0-9]$/.test(key)) {
          appendValue(key);
          return;
        }

        if (map[key]) {
          appendValue(map[key]);
          return;
        }

        if (key === 's') {
          appendValue('sin(');
          return;
        }
        if (key === 'c') {
          appendValue('cos(');
          return;
        }
        if (key === 't') {
          appendValue('tan(');
          return;
        }
        if (key === 'l') {
          appendValue('log(');
          return;
        }
        if (key === 'n') {
          appendValue('ln(');
          return;
        }
        if (key === 'r') {
          appendValue('√(');
          return;
        }
      });

      updateDisplay();
    </script>
  </body>
</html>
